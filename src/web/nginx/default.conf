# VDO.Ninja v30.2 (reescrituras de install.md del proyecto, sin Access-Control-Allow-Origin: todo es del mismo origen).
# TLS, HSTS y cabeceras de seguridad (Permissions-Policy con camera/microphone=(self), X-Frame-Options SAMEORIGIN) los pone
# Traefik delante: aquí no se duplican.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Detrás de Traefik (TLS en 443): sin esto, las redirecciones saldrían a http://host:8080/
    absolute_redirect off;
    # El JS cambia con cada versión de la imagen: el navegador revalida siempre. En `server` para que lo hereden todas las
    # locations (ninguna define add_header propio).
    add_header Cache-Control "no-cache";

    # /wss es de la señalización: Traefik lo envía al servidor de señalización solo con el Origin propio. Si llega aquí
    # (otro Origin), 404 en vez del index.html de la reescritura de abajo.
    location = /wss {
        return 404;
    }

    # /<carpeta>/<página> (por ejemplo /examples/x): el fichero, su .html o el índice de la carpeta (install.md).
    location ~ ^/([^/]+)/([^/?]+)$ {
        try_files /$1/$2 /$1/$2.html /$1/$2/ /$2 /$2/ /$1/index.html;
    }

    location / {
        # /pagina.html -> /pagina, como en vdo.ninja (install.md). El primer carácter tras la barra no puede ser otra barra, una
        # barra invertida (\x5c: el lector de nginx convertiría «\\» en «\») ni «?»: con «//evil.example.html» la regex original
        # de install.md redirigía a //evil.example (otro host). Sin query (la regex no casa si la hay); nunca $uri en el return
        # (va decodificado: inyección de CRLF).
        if ($request_uri ~ ^/([^/?\x5c][^?]*)\.html$) {
            return 302 /$1;
        }
        try_files $uri $uri.html $uri/ /index.html;
    }
}
